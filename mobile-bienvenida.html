<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Trato — Bienvenida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      min-height: 680px;
      padding: 48px 28px 40px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand-text {
      font-size: 58px;
      font-weight: 900;
      color: var(--purple);
      letter-spacing: -2px;
      line-height: 1;
    }
    .brand-o {
      display: inline-flex;
      align-items: center;
      width: 58px;
      height: 58px;
      margin-left: -3px;
    }
    .brand-tagline {
      font-size: 18px;
      font-weight: 700;
      color: var(--teal);
      text-align: center;
      margin-bottom: 60px;
    }
    .circle-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      flex: 1;
      justify-content: center;
      width: 100%;
    }
    .circle-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: var(--purple);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      font-family: var(--font);
      font-size: 18px;
      font-weight: 800;
      color: white;
      text-align: center;
      line-height: 1.3;
      transition: transform 0.18s, box-shadow 0.18s;
      box-shadow: var(--shadow-lg);
      text-decoration: none;
    }
    .circle-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 12px 36px rgba(51,0,204,0.40);
    }
  </style>
</head>
<body class="mp-body">
<div class="mp-frame">
  <div class="mp-notch"></div>
  <div class="mp-screen">
    <div class="welcome-screen">
      <div class="brand-logo">
        <span class="brand-text">trat</span>
        <span class="brand-o">
          <svg viewBox="0 0 58 58" fill="none" width="58" height="58">
            <path d="M29 6 C43.36 6 55 17.64 55 32 C55 46.36 43.36 58 29 58 C14.64 58 3 46.36 3 32 C3 20.5 10.2 10.7 20.5 7"
                  stroke="#3300CC" stroke-width="8" stroke-linecap="round" fill="none"/>
            <polygon points="20.5,7 8,2 6,16" fill="#3300CC"/>
          </svg>
        </span>
      </div>
      <div class="brand-tagline">Subastas e Intercambios</div>
      <div class="circle-buttons">
        <a class="circle-btn" onclick="sessionStorage.setItem('trato_auth','1');window.location.href='index.html'" href="#">iniciar<br>sesión</a>
        <a class="circle-btn" onclick="sessionStorage.setItem('trato_auth','1');window.location.href='index.html'" href="#">crear<br>usuario</a>
      </div>
    </div>
  </div>
</div>
<nav class="mp-nav">
  <a href="mobile-home.html">Siguiente →</a>
  <span>·</span>
  <a href="mobile-splash.html">← Splash</a>
  <span>·</span>
  <a href="index.html">Demo</a>
</nav>
</body>
</html>
