<!DOCTYPE html>

  <link rel="stylesheet" href="css/styles.css">
  <style>
    .splash-screen {
      display: flex;
      flex-direction: column;

      min-height: 680px;
      background: #ffffff;
      padding: 40px 28px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .brand-text {
      font-size: 72px;
      font-weight: 900;
      color: var(--purple);
      letter-spacing: -2px;
      line-height: 1;
    }
    .brand-o {
      display: inline-flex;
      align-items: center;
      width: 72px;
      height: 72px;
      margin-left: -4px;
    }
    .brand-tagline {
      font-size: 22px;
      font-weight: 700;
      color: var(--teal);
      text-align: center;
      letter-spacing: 0.3px;
    }
  </style>
</head>

        <span class="brand-text">trat</span>

      <div class="brand-tagline">Subastas e Intercambios</div>
    </div>
  </div>
</div>
