<div class="notif-page">
  <div class="notif-wrap">

    <!-- Back -->
    <a routerLink="/home" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Inicio
    </a>

    <h1 class="tt notif-title">Notificaciones</h1>

    <!-- Controls -->
    <div class="notif-controls">
      <button class="btn-mark-all" (click)="markAllRead()" [disabled]="unreadCount === 0">
        Marcar todas como leídas
      </button>
      <p class="unread-label" *ngIf="unreadCount > 0">
        Tienes {{ unreadCount }} notificaciones nuevas
      </p>
    </div>

    <!-- Tabs -->
    <div class="notif-tabs" role="tablist">
      <button role="tab" [class.active]="activeTab==='todas'"  (click)="activeTab='todas'">Todas</button>
      <button role="tab" [class.active]="activeTab==='pujas'"  (click)="activeTab='pujas'">Mis pujas</button>
      <button role="tab" [class.active]="activeTab==='ventas'" (click)="activeTab='ventas'">Mis ventas</button>
      <button role="tab" [class.active]="activeTab==='pagos'"  (click)="activeTab='pagos'">Pagos</button>
    </div>

    <!-- Shared icon template -->
    <ng-template #iconTpl let-icon="icon">
      <ng-container [ngSwitch]="icon">

        <ng-container *ngSwitchCase="'hammer'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            <line x1="12" y1="11" x2="12" y2="17"></line>
            <line x1="9" y1="14" x2="15" y2="14"></line>
          </svg>
        </ng-container>

        <ng-container *ngSwitchCase="'clock'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </ng-container>

        <ng-container *ngSwitchCase="'trophy'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9H4a2 2 0 0 1-2-2V5h4"></path>
            <path d="M18 9h2a2 2 0 0 0 2-2V5h-4"></path>
            <path d="M6 2h12v7a6 6 0 0 1-12 0V2z"></path>
            <line x1="12" y1="15" x2="12" y2="22"></line>
            <line x1="8" y1="22" x2="16" y2="22"></line>
          </svg>
        </ng-container>

        <ng-container *ngSwitchCase="'payment'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        </ng-container>

        <ng-container *ngSwitchCase="'store'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </ng-container>

      </ng-container>
    </ng-template>

    <!-- HOY -->
    <ng-container *ngIf="todayGroup().length > 0">
      <div class="notif-group-label">HOY</div>
      <div class="notif-card" *ngFor="let n of todayGroup()"
           (click)="markRead(n)" [class.unread]="!n.read">
        <span class="notif-icon" [class.notif-icon--active]="!n.read">
          <ng-container *ngTemplateOutlet="iconTpl; context:{icon: n.icon}"></ng-container>
        </span>
        <div class="notif-body">
          <div class="notif-row-top">
            <span class="notif-card-title">{{ n.title }}</span>
            <span class="notif-dot" *ngIf="!n.read" aria-label="No leída"></span>
          </div>
          <p class="notif-text">{{ n.body }}</p>
          <div class="notif-row-bottom">
            <span class="notif-ago">{{ n.ago }}</span>
            <a *ngIf="n.actionLabel" [routerLink]="n.actionRoute"
               class="notif-action" (click)="$event.stopPropagation()">{{ n.actionLabel }}</a>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- AYER -->
    <ng-container *ngIf="yesterdayGroup().length > 0">
      <div class="notif-group-label">AYER</div>
      <div class="notif-card" *ngFor="let n of yesterdayGroup()"
           (click)="markRead(n)" [class.unread]="!n.read">
        <span class="notif-icon" [class.notif-icon--active]="!n.read">
          <ng-container *ngTemplateOutlet="iconTpl; context:{icon: n.icon}"></ng-container>
        </span>
        <div class="notif-body">
          <div class="notif-row-top">
            <span class="notif-card-title">{{ n.title }}</span>
            <span class="notif-dot" *ngIf="!n.read" aria-label="No leída"></span>
          </div>
          <p class="notif-text">{{ n.body }}</p>
          <div class="notif-row-bottom">
            <span class="notif-ago">{{ n.ago }}</span>
            <a *ngIf="n.actionLabel" [routerLink]="n.actionRoute"
               class="notif-action" (click)="$event.stopPropagation()">{{ n.actionLabel }}</a>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Empty state -->
    <p class="notif-empty"
       *ngIf="todayGroup().length === 0 && yesterdayGroup().length === 0">
      No tienes notificaciones en esta categoría.
    </p>

  </div>
</div>
