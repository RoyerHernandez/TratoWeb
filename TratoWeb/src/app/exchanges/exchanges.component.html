<section class="exchanges-section" id="intercambios">
  <div class="section-container">
    <div class="section-header">
      <h2 class="tt">Intercambios</h2>
      <a routerLink="/exchanges">Ver todos →</a>
    </div>
    <div class="auction-grid">
      <article class="exchange-card" *ngFor="let exch of exchange" routerLink="/exchanges">
        <div class="card-img-wrap">
          <img [src]="exch.image" [alt]="exch.productName" class="card-img">
          <span class="card-badge">Intercambio</span>
        </div>
        <div class="card-body">
          <div class="card-info">
            <span class="card-category">{{ exch.exchangesState }}</span>
            <h3 class="card-title">{{ exch.productName }}</h3>
            <p class="card-desc">{{ exch.description }}</p>
          </div>
          <div class="card-footer">
            <div class="card-price">
              <span class="price-label">Valor estimado</span>
              <span class="tt price-value">{{ exch.exchangesValue }}</span>
            </div>
            <a routerLink="/exchanges" class="btn-exchange" (click)="$event.stopPropagation()">Ver oferta</a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
